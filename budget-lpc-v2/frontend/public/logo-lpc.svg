<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Budget LPC logo</title>
  <desc id="desc">Circular dark LPC logo with a blue geometric control-center symbol.</desc>
  <defs>
    <linearGradient id="badge" x1="44" y1="30" x2="212" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172b55"/>
      <stop offset="0.52" stop-color="#0a1227"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="blueLeft" x1="67" y1="119" x2="131" y2="46" gradientUnits="userSpaceOnUse">
