<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#242e29"><title>Budget LPC · Reconnecting</title><style>html{background:#f4f4ef;color:#293b2e;font-family:'Segoe UI',sans-serif}body{min-height:85vh;display:grid;place-items:center;margin:0;padding:25px}main{max-width:370px;text-align:center}img{width:88px;height:88px;border-radius:22px}h1{font:32px Georgia,serif;margin:24px 0 12px}p{font-size:14px;line-height:1.7;color:#596650}button,a{display:inline-block;margin-top:20px;background:#2d4032;color:#fff;padding:13px 24px;border:0;border-radius:8px;text-decoration:none;font:inherit}button:disabled{opacity:.65}small{display:block;margin-top:26px;line-height:1.6;color:#66715c}</style></head><body><main><img src="/icons/icon-192.png" alt="Budget LPC logo"><h1>Let’s reconnect.</h1><p id="status" role="status">Connecting to Budget LPC. The free online server may need about a minute to wake up. Your laptop does not need to be on.</p><button id="retry" type="button">Try again</button><p><a href="https://budget-lpc.onrender.com/">Open the online version</a></p><small id="address"></small><small>Your records stay on the server.<br>No changes are saved while disconnected.</small></main><script src="/reconnect.js"></script></body></html>
